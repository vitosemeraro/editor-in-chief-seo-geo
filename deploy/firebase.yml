# Firebase Hosting: publish on every push to main.
# Secret: FIREBASE_SERVICE_ACCOUNT (JSON of a service account with Firebase Hosting Admin).
# Copy to .github/workflows/deploy.yml in your SITE repo and set projectId.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: python3 scripts/check_links.py public
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: your-firebase-project-id
